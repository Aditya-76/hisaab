name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck & build (tsc --build)
        run: pnpm build

      - name: Tests (Vitest)
        run: pnpm test

      - name: Fixture run & coverage report
        run: |
          node packages/cli/dist/index.js run-fixtures --summary >> "$GITHUB_STEP_SUMMARY"

      - name: License audit (OSI-only dependencies)
        run: node scripts/license-audit.mjs

      - name: Dependency boundaries (no RN in core/parsers/cli)
        run: node scripts/check-dependency-boundaries.mjs
